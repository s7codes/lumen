# Lumen on one VPS. Caddy terminates HTTPS (automatic certificates, HTTP/3)
# and proxies to the app on the Compose bridge network; the app is never
# published to the host. Configure in .env (see .env.example), then:
#
#   docker compose up -d --build

name: lumen

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    build: .
    restart: unless-stopped
    # tini as PID 1 forwards SIGTERM; the server then drains in-flight requests and flushes the store.
    init: true
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4173'
      # Caddy is the one trusted hop: X-Forwarded-For, -Proto and -Host are read from it only.
      LUMEN_TRUST_PROXY: ${LUMEN_TRUST_PROXY:-1}
      # A placeholder or anything under 32 characters is refused in favour of a per-process key.
      LUMEN_SESSION_SECRET: ${LUMEN_SESSION_SECRET:-change-me-in-production}
      LUMEN_DATA_DIR: /data
      LUMEN_LLM_PROVIDER: ${LUMEN_LLM_PROVIDER:-auto}
      LUMEN_LLM_MODEL: ${LUMEN_LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    # Lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an Ollama on the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - lumen_data:/data
    expose:
      - '4173'
    # The process writes only to /data: everything else is read-only and unprivileged.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-lumen.s7codes.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  lumen_data:
  caddy_data:
  caddy_config:
