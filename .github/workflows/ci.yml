name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Every JavaScript action runs on Node 24, so the runner raises no Node 20 deprecation notices.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# develop and main are pushed together at the same SHA; only main triggers a
# push run, and a newer run on the same ref cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest already ships the Chromium shared libraries, and the app
      # self-hosts its fonts, so no apt mirror is touched here.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright suite
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
